name: veriqo
services:
  db:
    image: postgres:15-alpine
    container_name: veriqo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: checkflow
    # ports:
    #   - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: veriqo-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/checkflow
      SECRET_KEY: "demo-secret-key-change-it-in-production"
      GROQ_API_KEY: "" # Users can set this in their local .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: veriqo-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
